<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ANGVEY</title></head>
<body>
<script>
(async () => {
  const parts = ['c0.txt','c1.txt','c2.txt','c3.txt','c4.txt','c5.txt'];
  const texts = await Promise.all(parts.map(p => fetch(p).then(r => r.text())));
  const html = texts.join('');
  document.open();
  document.write(html);
  document.close();
})().catch(e => { document.body.textContent = 'Load error: ' + e; });
</script>
</body></html>
