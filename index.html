<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ANGVEY</title>
<style>body{margin:0;background:#09090B;color:#A1A1AA;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head><body><p id="s">Loading ANGVEY…</p>
<script>
(async()=>{
  try {
    const parts=['c0.txt','c1.txt','c2.txt','c3.txt','c4.txt','c5.txt','c6.txt','c7.txt','c8.txt','c9.txt','c10.txt','c11.txt','c12.txt','c13.txt'];
    const texts=await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p+' '+r.status);return r.text()})));
    const html=texts.join('');
    document.open();document.write(html);document.close();
  } catch(e) {
    document.getElementById('s').textContent='Load failed: '+e;
  }
})();
</script></body></html>
